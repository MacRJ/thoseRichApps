name: Deploy to thoserichapps.com

# Every push to main builds the site and publishes it.
# dev is the working branch; merge dev into main to ship it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # lets the job sign in to AWS without stored keys
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::427448970597:role/thoserichapps-github-deploy
  BUCKET: thoserichapps.com
  DISTRIBUTION_ID: E12BG2AUIGFM8F

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No `environment:` here on purpose. The AWS role trusts exactly
    #   repo:MacRJ@29076614/thoseRichApps@1441399493:ref:refs/heads/main
    # (GitHub includes the owner and repo ID numbers). Adding an environment,
    # or renaming/moving the repo, changes that identity and needs a trust update.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed files under assets/ never change, so browsers can cache them for a year.
      - name: Upload versioned assets
        run: |
          if [ -d dist/assets ]; then
            aws s3 sync dist/assets "s3://$BUCKET/assets" --delete \
              --cache-control "public, max-age=31536000, immutable"
          else
            aws s3 rm "s3://$BUCKET/assets" --recursive
          fi

      # Everything else (index.html, favicon, api/*.json) is revalidated on each visit.
      # _archive/ holds earlier versions of the site and is never touched.
      - name: Upload pages
        run: |
          aws s3 sync dist "s3://$BUCKET" --delete \
            --exclude "assets/*" --exclude "_archive/*" \
            --cache-control "no-cache"

      - name: Clear CloudFront cache
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"
          echo "Live: https://thoserichapps.com"
